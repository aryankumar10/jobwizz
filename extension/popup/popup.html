<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobWizz</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>JobWizz</h1>
  </header>

  <div id="toast" class="hidden"></div>

  <form id="jobForm">
    <div class="form-group">
      <label for="role">Role</label>
      <input type="text" id="role" name="role" required>
    </div>
    
    <div class="form-group">
      <label for="company">Company</label>
      <input type="text" id="company" name="company" required>
    </div>

    <div class="form-group">
      <label for="source">Source</label>
      <select id="source" name="source">
        <option value="LinkedIn">LinkedIn</option>
        <option value="Handshake">Handshake</option>
        <option value="Indeed">Indeed</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="location">Location</label>
      <input type="text" id="location" name="location">
    </div>

    <div class="form-group">
      <label for="appliedOn">Applied On</label>
      <input type="date" id="appliedOn" name="appliedOn">
    </div>

    <div class="form-group">
      <label for="jobUrl">Job URL</label>
      <input type="url" id="jobUrl" name="jobUrl">
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
        <option value="Withdrawn">Withdrawn</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="3"></textarea>
    </div>

    <div class="actions">
      <button type="button" id="btnSaveLocal" class="btn btn-green">Save Locally</button>
      <button type="button" id="btnSaveCloud" class="btn btn-blue hidden">Save to Cloud</button>
      <button type="button" id="btnExport" class="btn btn-outline">Export JSON</button>
    </div>
  </form>

  <hr>

  <section id="authSection">
    <div id="loggedOutView">
      <h3>Cloud Sync</h3>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password">
      </div>
      <div class="auth-actions">
        <button type="button" id="btnLogin" class="btn btn-blue">Log In</button>
        <button type="button" id="btnSignup" class="btn btn-outline">Sign Up</button>
      </div>
    </div>
    
    <div id="loggedInView" class="hidden">
      <p>Logged in as: <span id="userEmail"></span></p>
      <button type="button" id="btnLogout" class="btn btn-outline">Log Out</button>
    </div>
  </section>

  <!-- Load popup logic -->
  <script type="module" src="popup.js"></script>
</body>
</html>
